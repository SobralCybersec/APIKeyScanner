name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/api-key-scanner package/
          cp README.md RELEASE_NOTES.md package/
          tar -czf api-key-scanner-${{ matrix.target }}.tar.gz -C package .
          shasum -a 256 api-key-scanner-${{ matrix.target }}.tar.gz > api-key-scanner-${{ matrix.target }}.sha256
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/${{ matrix.target }}/release/api-key-scanner.exe package/
          Copy-Item README.md, RELEASE_NOTES.md package/
          Compress-Archive -Path package/* -DestinationPath api-key-scanner-${{ matrix.target }}.zip
          (Get-FileHash api-key-scanner-${{ matrix.target }}.zip -Algorithm SHA256).Hash + "  api-key-scanner-${{ matrix.target }}.zip" | Out-File api-key-scanner-${{ matrix.target }}.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: api-key-scanner-${{ matrix.target }}
          path: |
            api-key-scanner-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: api-key-scanner-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

